version: '3.8'

services:
  backend:
    build: ./server
    ports:
      - "3001:3001"
    env_file:
      - .env
    volumes:
      - ./worldcup.db:/app/worldcup.db
    environment:
      - DB_PATH=/app/worldcup.db

  frontend:
    build: 
      context: ./client
      args:
        - VITE_API_URL=http://localhost:3001
    ports:
      - "8080:8080"
    depends_on:
      - backend
